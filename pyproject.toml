[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "connectome-control"
version = "1.0.0"
description = "Turning the fruit fly connectome into a robot controller: graph analysis, spiking simulation, and closed-loop control in MuJoCo."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rithika" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "requests>=2.31",
    "tqdm>=4.66",
    "matplotlib>=3.10",
]

[project.optional-dependencies]
sim = [
    "brian2>=2.7",
    "torch>=2.2",
]
control = [
    # NeuroMechFly v2 body (MuJoCo). flygym 2.x needs Python >= 3.12; its locomotion
    # controllers (flygym_demo.complex_terrain) ship in the same wheel.
    "flygym>=2.1.1,<2.2; python_version >= '3.12'",
    "pillow>=11",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"